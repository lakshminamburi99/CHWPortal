name: Deploy to Google Cloud Platform

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  ARTIFACT_REPO: chw-repo
  DB_INSTANCE: chw-db-instance
  DB_NAME: chw_care_db

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build Docker images and push to Artifact Registry
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry Repository Exists
        run: |
          if ! gcloud artifacts repositories describe ${{ env.ARTIFACT_REPO }} --location=${{ env.GCP_REGION }} &>/dev/null; then
            gcloud artifacts repositories create ${{ env.ARTIFACT_REPO }} \
              --repository-format=docker \
              --location=${{ env.GCP_REGION }} \
              --description="Docker repository for CHW Care Platform"
          fi

      - name: Build & Push Backend Image
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:latest"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" ./backend
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy to Cloud Run
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch Cloud SQL Connection Name
        id: cloudsql
        run: |
          CONN_NAME=$(gcloud sql instances describe ${{ env.DB_INSTANCE }} --format="value(connectionName)")
          echo "connection_name=$CONN_NAME" >> $GITHUB_OUTPUT

      - name: Automate GCP Agent APIs & IAM Permissions
        run: |
          chmod +x ./setup_gcp_agent.sh
          ./setup_gcp_agent.sh || true

      - name: Deploy Backend to Cloud Run
        run: |
          CONN_NAME="${{ steps.cloudsql.outputs.connection_name }}"

          DB_PASS="${{ secrets.DB_PASSWORD }}"
          if [ -z "$DB_PASS" ]; then DB_PASS="Password123!"; fi

          # URL-encode the password to handle special characters (like @)
          DB_PASS_ENCODED=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote_plus(sys.argv[1]))" "$DB_PASS")

          JWT_SEC="${{ secrets.JWT_SECRET }}"
          if [ -z "$JWT_SEC" ]; then JWT_SEC="SecretJWTKeyForCWSTPlatform2026"; fi

          GEMINI_KEY="${{ secrets.GEMINI_API_KEY }}"

          DB_URI="postgresql://postgres:${DB_PASS_ENCODED}@/${{ env.DB_NAME }}?host=/cloudsql/${CONN_NAME}"

          gcloud run deploy chw-backend \
            --image="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}" \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8000 \
            --add-cloudsql-instances="$CONN_NAME" \
            --set-env-vars="DATABASE_URL=${DB_URI},POSTGRES_USER=postgres,POSTGRES_PASSWORD=${DB_PASS},POSTGRES_DB=${{ env.DB_NAME }},POSTGRES_SERVER=/cloudsql/${CONN_NAME},JWT_SECRET=${JWT_SEC},ENVIRONMENT=production,DEMO_MODE=true,GEMINI_API_KEY=${GEMINI_KEY},GEMINI_MODEL=gemini-2.5-flash"

      - name: Fetch Backend Production URL
        id: backend_url
        run: |
          URL=$(gcloud run services describe chw-backend \
            --region=${{ env.GCP_REGION }} \
            --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend Image
        run: |
          BACKEND_API_URL="${{ steps.backend_url.outputs.url }}/api/v1"
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:latest"
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
          docker build --build-arg VITE_API_URL="$BACKEND_API_URL" \
            -t "$IMAGE_TAG" -t "$IMAGE_LATEST" ./frontend
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy chw-frontend \
            --image="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}" \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=80

      - name: Deployment Output Summary
        run: |
          BACKEND_URL=$(gcloud run services describe chw-backend --region=${{ env.GCP_REGION }} --format="value(status.url)")
          FRONTEND_URL=$(gcloud run services describe chw-frontend --region=${{ env.GCP_REGION }} --format="value(status.url)")
          echo "================================================="
          echo "✅ Frontend App  : $FRONTEND_URL"
          echo "✅ Backend API   : $BACKEND_URL"
          echo "✅ Swagger Docs  : $BACKEND_URL/docs"
          echo "================================================="
