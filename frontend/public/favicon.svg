<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="needleNorth" x1="32" y1="10" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="32" y1="32" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Outer compass dial ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.85" />

  <!-- Cardinal tick marks -->
  <line x1="32" y1="12" x2="32" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="48" x2="32" y2="52" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="32" x2="16" y2="32" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="48" y1="32" x2="52" y2="32" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Compass Needle (Care / Medical Navigation Theme) -->
  <!-- North Arrow (Cyan/Blue) -->
  <polygon points="32,13 37,32 32,29" fill="url(#needleNorth)" />
  <polygon points="32,13 27,32 32,29" fill="#0284c7" />

  <!-- South Arrow (Slate) -->
  <polygon points="32,51 37,32 32,35" fill="url(#needleSouth)" />
  <polygon points="32,51 27,32 32,35" fill="#1e293b" />

  <!-- Central Pivot & Plus / Heartbeat pulse -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" />
  <circle cx="32" cy="32" r="2" fill="#0284c7" />
</svg>