<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-grad-primary" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0f766e" />
    </linearGradient>
    <linearGradient id="fav-grad-secondary" x1="90" y1="10" x2="10" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="fav-grad-accent" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#67e8f9" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <radialGradient id="fav-bg" cx="50" cy="50" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="100" height="100" rx="22" fill="url(#fav-bg)" />
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="#38bdf8" strokeWidth="1.5" strokeOpacity="0.3" fill="none" />

  <!-- Outer Compass Coordinate Ring -->
  <circle cx="50" cy="50" r="38" stroke="url(#fav-grad-primary)" strokeWidth="2" strokeOpacity="0.4" strokeDasharray="2 3" />

  <!-- 4 Cardinal Compass Tick Markers -->
  <line x1="50" y1="8" x2="50" y2="14" stroke="#38bdf8" strokeWidth="2.5" strokeLinecap="round" />
  <line x1="50" y1="86" x2="50" y2="92" stroke="#10b981" strokeWidth="2.5" strokeLinecap="round" />
  <line x1="8" y1="50" x2="14" y2="50" stroke="#0284c7" strokeWidth="2.5" strokeLinecap="round" />
  <line x1="86" y1="50" x2="92" y2="50" stroke="#34d399" strokeWidth="2.5" strokeLinecap="round" />

  <!-- Inner Halo -->
  <circle cx="50" cy="50" r="28" fill="url(#fav-grad-primary)" fillOpacity="0.1" stroke="url(#fav-grad-secondary)" strokeWidth="1.2" strokeOpacity="0.4" />

  <!-- Compass Needle / Medical Cross Arms -->
  <path d="M50 18 L55 40 L50 45 L45 40 Z" fill="url(#fav-grad-accent)" />
  <path d="M50 18 L55 40 L50 45 Z" fill="#ffffff" fillOpacity="0.3" />
  <path d="M50 82 L45 60 L50 55 L55 60 Z" fill="url(#fav-grad-secondary)" />
  <path d="M50 82 L45 60 L50 55 Z" fill="#ffffff" fillOpacity="0.2" />
  <path d="M18 50 L40 45 L45 50 L40 55 Z" fill="url(#fav-grad-primary)" />
  <path d="M18 50 L40 45 L45 50 Z" fill="#ffffff" fillOpacity="0.25" />
  <path d="M82 50 L60 55 L55 50 L60 45 Z" fill="url(#fav-grad-secondary)" />
  <path d="M82 50 L60 55 L55 50 Z" fill="#ffffff" fillOpacity="0.25" />

  <!-- Pulse Waveform -->
  <path d="M35 50 L42 50 L46 42 L50 58 L54 45 L57 53 L60 50 L65 50" stroke="#ffffff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
  <circle cx="50" cy="50" r="2.5" fill="#ffffff" />
</svg>